name: Build and physical-model checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify frozen readiness-study source
        run: npx tsx scripts/verify-study-source.ts
      - run: npm test
      - run: npm run build
      - run: npm run check:budget
      - uses: actions/upload-artifact@v4
        with:
          name: tacit-site
          path: dist
          retention-days: 3
